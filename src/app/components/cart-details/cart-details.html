<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title fs-5" id="staticBackdropLabel">Tu carrito</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            @if (cartService.items.length === 0) {
            <div class="text-center">
                <p class="mt-2 text-muted">El carrito está vacío.</p>
            </div>
            } @else {
            <ul class="p-0">
                @for (item of cartService.items; track $index) {
                <li class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="m-0">{{ item.name }} - {{ item.restaurantName }}</p>
                        <p class="mb-2 text-muted">${{ item.price }}</p>
                    </div>
                    <button class="btn btn-sm btn-outline-danger border-0" (click)="cartService.eliminar(item)">
                        Eliminar
                    </button>
                </li>
                }
            </ul>
            }
        </div>
    </div>
</div>
