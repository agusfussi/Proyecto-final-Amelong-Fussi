<header class="container mb-4">
  <nav class="navbar">
    <a class="navbar-brand fw-bold" routerLink=""><img class="rounded-4 height-low w-auto" src="favicon.ico"
        alt="logo"><span class="ms-2 d-none d-sm-inline">MenuAF</span></a>
    <div class="ms-auto d-flex align-items-center gap-1">
      <div data-bs-toggle="modal" data-bs-target="#cart">
        <svg xmlns="http://www.w3.org/2000/svg" id="cart-svg" viewBox="0 0 24 24" fill="none">
          <path
            d="M6.29977 5H21L19 12H7.37671M20 16H8L6 3H3M9 20C9 20.5523 8.55228 21 8 21C7.44772 21 7 20.5523 7 20C7 19.4477 7.44772 19 8 19C8.55228 19 9 19.4477 9 20ZM20 20C20 20.5523 19.5523 21 19 21C18.4477 21 18 20.5523 18 20C18 19.4477 18.4477 19 19 19C19.5523 19 20 19.4477 20 20Z"
            stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        @if (cartService.items.length > 0) {
        <span class="translate-middle badge rounded-pill bg-danger">
          {{ cartService.items.length }}
        </span>
        }
      </div>
      <div class="modal fade" id="cart" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <app-cart-details></app-cart-details>
      </div>
      <a class="btn btn-outline-dark" routerLink="/register">Registrarse</a>
      <a class="btn btn-dark" routerLink="/login">Iniciar sesión</a>
    </div>
  </nav>
</header>

<router-outlet />

    <p class="m-0">© 2025 MenuAF — Todos los derechos reservados.</p>

        <img src="https://app-insti-cdn.nuvemshop.com.br/site/dist/images/svgs/social-icons/instagram.svg?v=0c215ea"
          alt="Instagram" class="red-social-img">
      </a>
      <a>
        <img src="https://app-insti-cdn.nuvemshop.com.br/site/dist/images/svgs/social-icons/youtube.svg?v=0c215ea"
          alt="YouTube" class="red-social-img">
      </a>
      <a>
        <img src="https://app-insti-cdn.nuvemshop.com.br/site/dist/images/svgs/social-icons/x.svg?v=0c215ea" alt="X"
